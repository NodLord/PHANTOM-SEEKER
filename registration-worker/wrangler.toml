name = "phantom-seeker-registration"
main = "worker.js"
compatibility_date = "2026-10-12"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://nodlord.github.io,http://localhost:8000,http://127.0.0.1:8000"

[[d1_databases]]
binding = "DB"
database_name = "phantom-seeker-registration"
database_id = "587ba948-9ed8-489d-9ff9-47e42d52cc30"

[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "43211"
  [ratelimits.simple]
  limit = 12
  period = 60

[[ratelimits]]
name = "EDSM_RATE_LIMITER"
namespace_id = "43212"
  [ratelimits.simple]
  limit = 60
  period = 60
